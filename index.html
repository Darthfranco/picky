<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Picky">
    <meta name="theme-color" content="#000000">
    <script>
        // Restore appearance before the first paint, including offline launches.
        try {
            if (JSON.parse(localStorage.getItem('picky.preferences.v1'))?.theme === 'light') {
                document.documentElement.dataset.theme = 'light';
                document.querySelector('meta[name="theme-color"]').content = '#FFF5DF';
            }
        } catch (_) {}
    </script>
    <link rel="icon" type="image/png" href="./images/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon-black.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./install-guide.css">
    <link rel="stylesheet" href="./party.css">
    <link rel="stylesheet" href="./tournament.css">
    <title>Picky</title>
    <script src="./install-guide.js" defer></script>
    <script src="./pwa.js" defer></script>
</head>
<body>
    <main id="game-container" data-mode="finger" aria-label="Finger game" tabindex="-1">
        <div id="start-screen-ui"><img id="picky-logo" src="./PickyNB.png" alt="Picky" draggable="false"></div>
        <div id="wheel-area"><div id="wheel-pointer"></div><div id="wheel-graphic"></div></div>
        <div id="touch-area-divider"></div>
        <div class="finger-placement-area-label"></div>
        <div class="four-way-divider" id="divider-vertical"></div>
        <div class="four-way-divider" id="divider-horizontal"></div>
        <div id="winner-selector-container" data-ui aria-label="Game settings">
            <button class="selector-button" id="down-arrow" aria-label="Decrease count"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
            <div id="winner-count-display"><span id="winner-count">1</span> <span id="winner-label">Winner</span></div>
            <button class="selector-button" id="up-arrow" aria-label="Increase count"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button>
            <button class="selector-button" id="reverse-button" aria-label="Choose losers instead" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15m-4-4 4 4-4 4M20 16H5m4-4-4 4 4 4"/></svg></button>
        </div>
        <div id="mode-settings" data-ui hidden><div class="segmented-control" id="dice-options" role="group" aria-label="Dice type" hidden>
            <button class="choice-button" data-sides="6" aria-pressed="true">d6</button>
            <button class="choice-button" data-sides="8" aria-pressed="false">d8</button>
            <button class="choice-button" data-sides="12" aria-pressed="false">d12</button>
            <button class="choice-button" data-sides="20" aria-pressed="false">d20</button>
        </div></div>
        <div id="dice-stage" hidden><canvas id="dice-canvas" aria-label="3D dice"></canvas></div>
        <div id="number-stage" hidden><span id="number-value">0</span></div>
        <p id="hold-hint" hidden>Hold to roll</p>
        <div id="group-stage" hidden>
            <p id="group-hint">Tap once. Remember your number.</p>
            <div id="group-entries" aria-label="Players"></div>
            <p id="group-status" class="visually-hidden" role="status"></p>
        </div>
        <div id="group-actions" data-ui hidden>
            <button id="group-undo" class="quiet-button" disabled>Undo</button>
            <button id="group-clear" class="quiet-button" disabled>Clear</button>
            <button id="group-pick" class="primary-button" disabled>Pick</button>
        </div>
        <div id="result-screen" hidden aria-live="polite" aria-atomic="true">
            <div id="result-value"></div>
        </div>
    </main>
    <nav id="game-mode-switcher" aria-label="Game modes"></nav>
    <section id="menu-screen" hidden></section>
    <script src="./color-palette.js"></script>
    <script src="./dice-renderer.js"></script>
    <script src="./navigation.js"></script>
    <script src="./party-rules.js"></script>
    <script src="./party-mode.js"></script>
    <script src="./tournament-mode.js"></script>
    <script src="./app.js"></script>
</body>
</html>
